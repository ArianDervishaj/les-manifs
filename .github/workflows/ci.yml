name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly dependency audit (Monday 06:00 UTC), even without new commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values for the test run; the real ones only exist on the server.
      DJANGO_SECRET_KEY: ci-not-secret
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      DJANGO_ADMIN_URL: ci-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build .
