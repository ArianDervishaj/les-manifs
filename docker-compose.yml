services:
  web:
    build: .
    image: ghcr.io/ariandervishaj/les-manifs:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "False" # overrides the local value in .env
      DJANGO_ALLOWED_HOSTS: ${DOMAIN}
    volumes:
      - app_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
